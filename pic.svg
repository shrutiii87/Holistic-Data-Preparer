```svg
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="520"
     viewBox="0 0 1600 520"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Project Workflow — End-to-End Data Pipeline</title>
  <desc id="desc">Animated enterprise data engineering workflow from acquisition to final dataset export.</desc>

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030A12"/>
      <stop offset="100%" stop-color="#06111D"/>
    </linearGradient>

    <!-- Panel -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1826"/>
      <stop offset="100%" stop-color="#081421"/>
    </linearGradient>

    <!-- Subtle cyan glow -->
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#17334A"
            stroke-width="0.7"
            opacity="0.27"/>
    </pattern>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#38BDF8" opacity="0.16"/>
    </pattern>

    <!-- Pipeline gradient -->
    <linearGradient id="pipeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <!-- Progress -->
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="72%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <clipPath id="outerClip">
      <rect x="18" y="18" width="1564" height="484" rx="26"/>
    </clipPath>

    <style>
      .font {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .mono {
        font-family: "JetBrains Mono", Consolas, monospace;
      }

      .heading {
        fill: #F1F5F9;
        font-size: 31px;
        font-weight: 700;
        letter-spacing: -0.6px;
      }

      .eyebrow {
        fill: #22D3EE;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2.2px;
      }

      .subtitle {
        fill: #94A3B8;
        font-size: 12px;
        font-weight: 400;
      }

      .stageTitle {
        fill: #F1F5F9;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.9px;
      }

      .stageMeta {
        fill: #94A3B8;
        font-size: 8px;
        font-weight: 400;
      }

      .stageCode {
        fill: #647B8F;
        font-size: 7.5px;
        font-weight: 500;
      }

      .nodeNumber {
        fill: #22D3EE;
        font-size: 10px;
        font-weight: 700;
      }

      .panelLabel {
        fill: #647B8F;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 1.4px;
      }

      .panelValue {
        fill: #F1F5F9;
        font-size: 12px;
        font-weight: 700;
      }

      .success {
        fill: #10B981;
      }

      .statusText {
        fill: #94A3B8;
        font-size: 7.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .smallMono {
        fill: #22D3EE;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 8px;
      }

      .connector {
        fill: none;
        stroke: #173B55;
        stroke-width: 1.4;
        stroke-linecap: round;
      }

      .connectorActive {
        fill: none;
        stroke: url(#pipeline);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-dasharray: 4 8;
      }

      .nodeRing {
        fill: #081624;
        stroke: #23506A;
        stroke-width: 1.2;
      }

      .nodeInner {
        fill: none;
        stroke: #22D3EE;
        stroke-width: 1;
        opacity: 0.65;
      }

      .nodeTick {
        fill: none;
        stroke: #10B981;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .dot {
        fill: #22D3EE;
        filter: url(#cyanGlow);
      }

      .terminal {
        fill: #10B981;
        filter: url(#greenGlow);
      }
    </style>
  </defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1600" height="520" fill="#020810"/>

  <rect x="18" y="18"
        width="1564"
        height="484"
        rx="26"
        fill="url(#bg)"
        stroke="#17334A"
        stroke-width="1.2"/>

  <g clip-path="url(#outerClip)">
    <rect x="18" y="18" width="1564" height="484" fill="url(#grid)"/>
    <rect x="18" y="18" width="1564" height="484" fill="url(#dots)"/>

    <!-- subtle atmospheric lines -->
    <path d="M40 110H1560"
          stroke="#22D3EE"
          stroke-width="0.5"
          opacity="0.08"/>
    <path d="M40 448H1560"
          stroke="#22D3EE"
          stroke-width="0.5"
          opacity="0.08"/>
  </g>

  <!-- ========================================================= -->
  <!-- HEADER -->
  <!-- ========================================================= -->

  <g class="font">
    <text x="54" y="55" class="eyebrow">DATA PIPELINE</text>

    <text x="54" y="89" class="heading">Project Workflow</text>

    <line x1="54" y1="105"
          x2="355" y2="105"
          stroke="#17334A"
          stroke-width="1"/>

    <text x="54" y="126" class="subtitle">
      From raw sources to final dataset.
    </text>

    <!-- End-to-end pill -->
    <g transform="translate(366 108)">
      <rect width="154"
            height="25"
            rx="12.5"
            fill="#071923"
            stroke="#17506A"
            stroke-width="1"/>

      <circle cx="14" cy="12.5" r="3" fill="#10B981">
        <animate attributeName="opacity"
                 values="0.35;1;0.35"
                 dur="2.4s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="25" y="16"
            fill="#A7F3D0"
            font-size="8"
            font-weight="700"
            letter-spacing="1.1">
        END-TO-END PIPELINE
      </text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- WORKFLOW AREA -->
  <!-- ========================================================= -->

  <g id="workflow">

    <!-- ===================== -->
    <!-- CONNECTOR PATHS -->
    <!-- ===================== -->

    <!-- Row 1 -->
    <path class="connector"
          d="M142 194 H302 H462 H622 H782"/>

    <path class="connectorActive"
          d="M142 194 H302 H462 H622 H782">
      <animate attributeName="stroke-dashoffset"
               from="0"
               to="-48"
               dur="3s"
               repeatCount="indefinite"/>
    </path>

    <!-- Row transition -->
    <path class="connector"
          d="M782 194 C822 194 822 278 782 278"/>

    <path class="connectorActive"
          d="M782 194 C822 194 822 278 782 278">
      <animate attributeName="stroke-dashoffset"
               from="0"
               to="-48"
               dur="2s"
               repeatCount="indefinite"/>
    </path>

    <!-- Row 2 -->
    <path class="connector"
          d="M782 278 H622 H462 H302 H142"/>

    <path class="connectorActive"
          d="M782 278 H622 H462 H302 H142">
      <animate attributeName="stroke-dashoffset"
               from="0"
               to="-48"
               dur="3s"
               repeatCount="indefinite"/>
    </path>

    <!-- Moving pipeline indicator -->
    <circle r="2.5" class="dot">
      <animateMotion dur="6s"
                     repeatCount="indefinite"
                     path="M142 194 H302 H462 H622 H782 C822 194 822 278 782 278 H622 H462 H302 H142"/>
    </circle>

    <!-- ========================================================= -->
    <!-- 01 -->
    <!-- ========================================================= -->

    <g transform="translate(142 194)">
      <circle r="24" class="nodeRing"/>
      <circle r="18" class="nodeInner"/>

      <circle r="24"
              fill="none"
              stroke="#22D3EE"
              stroke-width="1"
