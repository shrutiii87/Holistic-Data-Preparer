<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#040A12"/>
      <stop offset="0.5" stop-color="#091522"/>
      <stop offset="1" stop-color="#050D16"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Subtle workflow grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#64748B"
            stroke-opacity=".045"/>
      <circle cx="20" cy="20" r="1"
              fill="#22D3EE"
              opacity=".05"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      .flow {
        stroke-dasharray: 6 9;
        animation: flow 1.5s linear infinite;
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -30;
        }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,100% { opacity: .35; }
        50% { opacity: 1; }
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .scan {
        animation: scan 3s ease-in-out infinite;
      }

      @keyframes scan {
        0% {
          transform: translateX(0);
          opacity: 0;
        }
        20%,75% {
          opacity: .8;
        }
        100% {
          transform: translateX(150px);
          opacity: 0;
        }
      }

    </style>
  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bg)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#grid)"/>

  <ellipse cx="1030"
           cy="145"
           rx="210"
           ry="135"
           fill="#2563EB"
           opacity=".045"
           filter="url(#softGlow)"/>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <rect x="48"
        y="45"
        width="3"
        height="125"
        rx="2"
        fill="url(#cyan)"
        filter="url(#glow)"/>

  <text x="70"
        y="63"
        font-size="10"
        fill="#67E8F9"
        class="small">
    DATA PIPELINE
  </text>

  <text x="70"
        y="101"
        font-size="30"
        fill="#F8FAFC"
        class="title">
    Project Workflow
  </text>

  <rect x="70"
        y="116"
        width="275"
        height="1"
        fill="#1E3A52"/>

  <text x="70"
        y="141"
        font-size="11.5"
        fill="#94A3B8">
    From raw sources to final dataset.
  </text>

  <g transform="translate(70 164)">

    <rect width="175"
          height="34"
          rx="9"
          fill="#071D19"
          stroke="#166534"/>

    <circle cx="18"
            cy="17"
            r="4"
            fill="#34D399"
            class="pulse"
            filter="url(#glow)"/>

    <text x="32"
          y="21"
          font-size="9.5"
          fill="#6EE7B7"
          class="small">
      END-TO-END PIPELINE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- WORKFLOW AREA -->
  <!-- ================================================= -->

  <g class="float">


    <!-- CONNECTING LINE -->

    <path d="M390 137
             H885"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M390 137
             H885"
          fill="none"
          stroke="url(#cyan)"
          stroke-width="2"
          class="flow"/>


    <!-- STEP 1 -->

    <g>

      <circle cx="390"
              cy="137"
              r="25"
              fill="#081C2A"
              stroke="#22D3EE"
              stroke-width="2"
              filter="url(#glow)"/>

      <text x="390"
            y="132"
            text-anchor="middle"
            font-size="9"
            fill="#67E8F9"
            class="small">
        01
      </text>

      <text x="390"
            y="146"
            text-anchor="middle"
            font-size="7"
            fill="#64748B">
        ACQUIRE
      </text>

      <text x="390"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#CBD5E1"
            class="small">
        DATA
      </text>

    </g>


    <!-- STEP 2 -->

    <g>

      <circle cx="488"
              cy="137"
              r="25"
              fill="#081C2A"
              stroke="#22D3EE"
              stroke-width="2"/>

      <text x="488"
            y="132"
            text-anchor="middle"
            font-size="9"
            fill="#67E8F9"
            class="small">
        02
      </text>

      <text x="488"
            y="146"
            text-anchor="middle"
            font-size="7"
            fill="#64748B">
        MERGE
      </text>

      <text x="488"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#CBD5E1"
            class="small">
        JOIN
      </text>

    </g>


    <!-- STEP 3 -->

    <g>

      <circle cx="586"
              cy="137"
              r="25"
              fill="#0D1224"
              stroke="#A78BFA"
              stroke-width="2"/>

      <text x="586"
            y="132"
            text-anchor="middle"
            font-size="9"
            fill="#C4B5FD"
            class="small">
        03
      </text>

      <text x="586"
            y="146"
            text-anchor="middle"
            font-size="7"
            fill="#8B7DB8">
        CLEAN
      </text>

      <text x="586"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#CBD5E1"
            class="small">
        CLEAN
      </text>

    </g>


    <!-- STEP 4 -->

    <g>

      <circle cx="684"
              cy="137"
              r="25"
              fill="#0D1224"
              stroke="#A78BFA"
              stroke-width="2"/>

      <text x="684"
            y="132"
            text-anchor="middle"
            font-size="9"
            fill="#C4B5FD"
            class="small">
        04
      </text>

      <text x="684"
            y="146"
            text-anchor="middle"
            font-size="7"
            fill="#8B7DB8">
        ENGINEER
      </text>

      <text x="684"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#CBD5E1"
            class="small">
        FEATURES
      </text>

    </g>


    <!-- STEP 5 -->

    <g>

      <circle cx="782"
              cy="137"
              r="25"
              fill="#081C2A"
              stroke="#22D3EE"
              stroke-width="2"/>

      <text x="782"
            y="132"
            text-anchor="middle"
            font-size="9"
            fill="#67E8F9"
            class="small">
        05
      </text>

      <text x="782"
            y="146"
            text-anchor="middle"
            font-size="7"
            fill="#64748B">
        SCALE
      </text>

      <text x="782"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#CBD5E1"
            class="small">
        TRANSFORM
      </text>

    </g>


    <!-- STEP 6 -->

    <g>

      <circle cx="880"
              cy="137"
              r="25"
              fill="#071D19"
              stroke="#34D399"
              stroke-width="2"
              filter="url(#glow)"/>

      <path d="M869 137
               L877 145
               L892 128"
            fill="none"
            stroke="#6EE7B7"
            stroke-width="2"/>

      <text x="880"
            y="181"
            text-anchor="middle"
            font-size="9"
            fill="#D1FAE5"
            class="small">
        EXPORT
      </text>

    </g>


    <!-- ================================================= -->
    <!-- LOWER PROCESS STRIP -->
    <!-- ================================================= -->

    <rect x="350"
          y="211"
          width="570"
          height="38"
          rx="10"
          fill="#07131F"
          stroke="#17354A"/>


    <text x="375"
          y="235"
          font-size="8.5"
          fill="#64748B"
          class="small">
      CLEAN
    </text>

    <circle cx="420"
            cy="230"
            r="3"
            fill="#22D3EE"
            class="pulse"/>


    <line x1="445"
          y1="221"
          x2="445"
          y2="240"
          stroke="#1E3448"/>


    <text x="470"
          y="235"
          font-size="8.5"
          fill="#64748B"
          class="small">
      ENGINEER
    </text>

    <circle cx="535"
            cy="230"
            r="3"
            fill="#A78BFA"
            class="pulse"/>


    <line x1="560"
          y1="221"
          x2="560"
          y2="240"
          stroke="#1E3448"/>


    <text x="585"
          y="235"
          font-size="8.5"
          fill="#64748B"
          class="small">
      SCALE
    </text>

    <circle cx="635"
            cy="230"
            r="3"
            fill="#22D3EE"
            class="pulse"/>


    <line x1="660"
          y1="221"
          x2="660"
          y2="240"
          stroke="#1E3448"/>


    <text x="685"
          y="235"
          font-size="8.5"
          fill="#64748B"
          class="small">
      TRANSFORM
    </text>

    <circle cx="755"
            cy="230"
            r="3"
            fill="#A78BFA"
            class="pulse"/>


    <line x1="780"
          y1="221"
          x2="780"
          y2="240"
          stroke="#1E3448"/>


    <text x="805"
          y="235"
          font-size="8.5"
          fill="#6EE7B7"
          class="small">
      READY
    </text>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT OUTPUT PANEL -->
  <!-- ================================================= -->

  <g class="float">

    <rect x="950"
          y="43"
          width="200"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>

    <text x="970"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      FINAL OUTPUT
    </text>

    <circle cx="1120"
            cy="65"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- FILE -->

    <rect x="970"
          y="84"
          width="160"
          height="58"
          rx="10"
          fill="#071D19"
          stroke="#14532D"/>

    <rect x="988"
          y="99"
          width="22"
          height="27"
          rx="3"
          fill="#092A22"
          stroke="#34D399"/>

    <path d="M993 106H1005
             M993 112H1005
             M993 118H1002"
          stroke="#6EE7B7"
          stroke-width="1.5"/>

    <text x="1022"
          y="107"
          font-size="9"
          fill="#D1FAE5"
          class="small">
      DATASET
    </text>

    <text x="1022"
          y="123"
          font-size="8"
          fill="#6EE7B7">
      READY
    </text>


    <!-- QUALITY -->

    <rect x="970"
          y="153"
          width="160"
          height="67"
          rx="9"
          fill="#06101A"
          stroke="#13283A"/>

    <text x="985"
          y="171"
          font-size="8"
          fill="#64748B"
          class="small">
      PIPELINE STATUS
    </text>


    <rect x="985"
          y="181"
          width="130"
          height="7"
          rx="3"
          fill="#17283A"/>

    <rect x="985"
          y="181"
          width="130"
          height="7"
          rx="3"
          fill="url(#green)"
          class="flow"/>


    <text x="985"
          y="207"
          font-size="8"
          fill="#64748B">
      FINAL
    </text>

    <text x="1115"
          y="207"
          text-anchor="end"
          font-size="8"
          fill="#6EE7B7"
          class="small">
      COMPLETE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DECORATIVE PARTICLES -->
  <!-- ================================================= -->

  <circle cx="920"
          cy="57"
          r="2"
          fill="#22D3EE"
          class="pulse"/>

  <circle cx="920"
          cy="270"
          r="2"
          fill="#A78BFA"
          class="pulse"/>

  <circle cx="1165"
          cy="274"
          r="2"
          fill="#34D399"
          class="pulse"/>


  <!-- Bottom border -->

  <rect x="48"
        y="274"
        width="1104"
        height="1"
        fill="#1E3448"/>

</svg>
