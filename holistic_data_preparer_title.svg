<svg width="100%" viewBox="0 0 1000 360" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Holistic Data Preparer title card</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Animated title card reading Holistic Data Preparer, with subtitle End-to-end Data Preprocessing and Feature Engineering</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070B17"/>
    <stop offset="50%" stop-color="#0D1224"/>
    <stop offset="100%" stop-color="#080B16"/>
  </linearGradient>
  <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A78BFA"/>
    <stop offset="55%" stop-color="#818CF8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
    
    
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="#64748B" stroke-opacity="0.06" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1000" height="360" rx="24" fill="url(#bg)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect width="1000" height="360" rx="24" fill="url(#grid)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<circle cx="150" cy="90" r="120" fill="#7C3AED" opacity="0.10" filter="url(#glow)" style="fill:rgb(124, 58, 237);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  
  
</circle>
<circle cx="860" cy="280" r="130" fill="#2563EB" opacity="0.10" filter="url(#glow)" style="fill:rgb(37, 99, 235);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  
  
</circle>

<text x="500" y="130" text-anchor="middle" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4" opacity="0" style="fill:rgb(167, 139, 250);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:auto">
  DATA ENGINEERING • MACHINE LEARNING
  
</text>

<g filter="url(#glow)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  <text x="500" y="205" text-anchor="middle" fill="url(#titleFill)" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" opacity="0" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:56px;font-weight:800;text-anchor:middle;dominant-baseline:auto">
    Holistic Data Preparer
    
  </text>
</g>

<text x="500" y="252" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="19" opacity="0" style="fill:rgb(148, 163, 184);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:19px;font-weight:400;text-anchor:middle;dominant-baseline:auto">
  End-to-end Data Preprocessing &amp; Feature Engineering
  
</text>

<line x1="400" y1="285" x2="600" y2="285" stroke="#3B82F6" stroke-width="2" stroke-opacity="0" style="fill:rgb(0, 0, 0);stroke:rgb(59, 130, 246);color:rgb(11, 11, 11);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  
  
  
</line>

<circle cx="500" cy="285" r="4" fill="#38BDF8" filter="url(#glow)" opacity="0" style="fill:rgb(56, 189, 248);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.863195;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  
</circle>

<rect x="1" y="1" width="998" height="358" rx="24" fill="none" stroke="#273449" stroke-width="2" style="fill:none;stroke:rgb(41, 59, 88);color:rgb(11, 11, 11);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  
</rect>

</svg>