<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bgG" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#040911"/>
      <stop offset="0.5" stop-color="#091522"/>
      <stop offset="1" stop-color="#050D16"/>
    </linearGradient>

    <linearGradient id="cyanG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="violetG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Different pattern -->
    <pattern id="circuitG"
             width="80"
             height="80"
             patternUnits="userSpaceOnUse">

      <path d="M0 40H22V18H40"
            fill="none"
            stroke="#38BDF8"
            stroke-opacity=".035"
            stroke-width="1"/>

      <path d="M80 20H58V52H42"
            fill="none"
            stroke="#A78BFA"
            stroke-opacity=".035"
            stroke-width="1"/>

      <circle cx="40" cy="18" r="2"
              fill="#22D3EE"
              opacity=".08"/>

      <circle cx="42" cy="52" r="2"
              fill="#A78BFA"
              opacity=".08"/>

    </pattern>

    <filter id="glowG">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowG">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      .flow {
        stroke-dasharray: 6 9;
        animation: flowG 1.4s linear infinite;
      }

      @keyframes flowG {
        to {
          stroke-dashoffset: -30;
        }
      }

      .float {
        animation: floatG 4s ease-in-out infinite;
      }

      @keyframes floatG {
        0%,100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .pulse {
        animation: pulseG 2s ease-in-out infinite;
      }

      @keyframes pulseG {
        0%,100% {
          opacity: .35;
        }
        50% {
          opacity: 1;
        }
      }

      .rotate {
        animation: rotateG 8s linear infinite;
        transform-origin: center;
      }

      @keyframes rotateG {
        to {
          transform: rotate(360deg);
        }
      }

      .scan {
        animation: scanG 3s ease-in-out infinite;
      }

      @keyframes scanG {
        0%,100% {
          transform: translateX(0);
          opacity: 0;
        }
        25%,75% {
          opacity: .8;
        }
        100% {
          transform: translateX(120px);
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bgG)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#circuitG)"/>

  <ellipse cx="1000"
           cy="150"
           rx="210"
           ry="140"
           fill="#7C3AED"
           opacity=".045"
           filter="url(#softGlowG)"/>


  <!-- ================================================= -->
  <!-- LEFT HEADER -->
  <!-- ================================================= -->

  <rect x="48"
        y="48"
        width="3"
        height="132"
        rx="2"
        fill="url(#cyanG)"
        filter="url(#glowG)"/>

  <text x="70"
        y="66"
        font-size="10"
        fill="#A78BFA"
        class="small">
    DATA PIPELINE / PART G
  </text>

  <!-- Safe single-line heading -->
  <text x="70"
        y="108"
        font-size="27"
        fill="#F8FAFC"
        class="title">
    Feature Construction
  </text>

  <text x="70"
        y="139"
        font-size="22"
        fill="url(#cyanG)"
        class="title">
    &amp; Transformation
  </text>

  <rect x="70"
        y="153"
        width="270"
        height="1"
        fill="#1E3A52"/>

  <text x="70"
        y="176"
        font-size="11.5"
        fill="#94A3B8">
    Build useful features from existing data.
  </text>


  <!-- STATUS -->

  <g transform="translate(70 199)">

    <rect width="205"
          height="35"
          rx="9"
          fill="#101024"
          stroke="#46327A"/>

    <circle cx="18"
            cy="17"
            r="4"
            fill="#A78BFA"
            filter="url(#glowG)"
            class="pulse"/>

    <text x="32"
          y="21"
          font-size="9.5"
          fill="#C4B5FD"
          class="small">
      TRANSFORMATION ACTIVE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- INPUT / TRANSFORMATION AREA -->
  <!-- DIFFERENT LAYOUT: HORIZONTAL FLOW -->
  <!-- ================================================= -->

  <g class="float">


    <!-- INPUT NODE -->

    <rect x="390"
          y="72"
          width="145"
          height="55"
          rx="12"
          fill="#081725"
          stroke="#155E75"/>

    <!-- Data grid icon -->

    <rect x="409"
          y="87"
          width="24"
          height="24"
          rx="3"
          fill="#09283A"
          stroke="#22D3EE"/>

    <path d="M417 87V111
             M425 87V111
             M409 95H433
             M409 103H433"
          stroke="#22D3EE"
          stroke-width="1"/>

    <text x="448"
          y="94"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      EXISTING
    </text>

    <text x="448"
          y="110"
          font-size="8"
          fill="#64748B">
      FEATURES
    </text>


    <!-- CONSTRUCTION CARD -->

    <rect x="565"
          y="72"
          width="155"
          height="55"
          rx="12"
          fill="#0D1224"
          stroke="#6D28D9"/>

    <!-- Gear-like icon -->

    <g transform="translate(593 99)">

      <circle r="13"
              fill="#16112E"
              stroke="#A78BFA"
              stroke-width="2"/>

      <circle r="5"
              fill="#A78BFA"
              class="pulse"/>

      <path d="M0 -19V-13
               M0 13V19
               M-19 0H-13
               M13 0H19
               M-13 -13L-9 -9
               M13 13L9 9
               M13 -13L9 -9
               M-13 13L-9 9"
            stroke="#C4B5FD"
            stroke-width="2"/>

    </g>

    <text x="620"
          y="94"
          font-size="10"
          fill="#E9D5FF"
          class="small">
      CONSTRUCT
    </text>

    <text x="620"
          y="110"
          font-size="8"
          fill="#8B7DB8">
      NEW FEATURES
    </text>


    <!-- TRANSFORMATION CARD -->

    <rect x="750"
          y="72"
          width="145"
          height="55"
          rx="12"
          fill="#081725"
          stroke="#155E75"/>

    <!-- Transformation arrows -->

    <path d="M770 101
             H807
             M799 93L807 101L799 109"
          fill="none"
          stroke="#22D3EE"
          stroke-width="2"/>

    <path d="M780 91
             H798"
          stroke="#67E8F9"
          stroke-width="1.5"/>

    <path d="M780 111
             H798"
          stroke="#67E8F9"
          stroke-width="1.5"/>

    <text x="824"
          y="94"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      TRANSFORM
    </text>

    <text x="824"
          y="110"
          font-size="8"
          fill="#64748B">
      APPLY RULES
    </text>


    <!-- FLOW -->

    <path d="M535 99H565"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M535 99H565"
          fill="none"
          stroke="url(#cyanG)"
          stroke-width="2"
          class="flow"/>

    <path d="M720 99H750"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M720 99H750"
          fill="none"
          stroke="url(#violetG)"
          stroke-width="2"
          class="flow"/>


    <!-- ================================================= -->
    <!-- LOWER FEATURE STREAM -->
    <!-- ================================================= -->

    <rect x="390"
          y="158"
          width="505"
          height="67"
          rx="14"
          fill="#07131F"
          stroke="#17354A"/>


    <text x="414"
          y="180"
          font-size="9"
          fill="#64748B"
          class="small">
      FEATURE SPACE
    </text>


    <!-- Original features -->

    <g>

      <circle cx="420"
              cy="201"
              r="5"
              fill="#22D3EE"/>

      <circle cx="440"
              cy="207"
              r="4"
              fill="#38BDF8"/>

      <circle cx="460"
              cy="198"
              r="4"
              fill="#67E8F9"/>

      <circle cx="480"
              cy="211"
              r="5"
              fill="#22D3EE"/>

    </g>


    <!-- Transformation path -->

    <path d="M495 202
             C540 165 570 220 615 187
             C650 161 678 206 720 181"
          fill="none"
          stroke="url(#violetG)"
          stroke-width="2.5"
          filter="url(#glowG)"
          class="flow"/>


    <!-- New features -->

    <g class="pulse">

      <circle cx="750"
              cy="184"
              r="5"
              fill="#A78BFA"/>

      <circle cx="770"
              cy="201"
              r="4"
              fill="#C084FC"/>

      <circle cx="790"
              cy="177"
              r="5"
              fill="#A78BFA"/>

      <circle cx="815"
              cy="194"
              r="4"
              fill="#C084FC"/>

      <circle cx="840"
              cy="173"
              r="5"
              fill="#A78BFA"/>

    </g>


    <text x="414"
          y="213"
          font-size="8"
          fill="#22D3EE">
      INPUT
    </text>

    <text x="824"
          y="213"
          font-size="8"
          fill="#C4B5FD">
      NEW
    </text>


    <!-- OUTPUT -->

    <rect x="895"
          y="87"
          width="35"
          height="35"
          rx="9"
          fill="#071D19"
          stroke="#166534"/>

    <path d="M904 104L911 111L922 98"
          fill="none"
          stroke="#6EE7B7"
          stroke-width="2"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT MONITOR -->
  <!-- ================================================= -->

  <g class="float">

    <rect x="950"
          y="42"
          width="200"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>

    <text x="970"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      FEATURE MONITOR
    </text>

    <circle cx="1120"
            cy="65"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- Metrics -->

    <rect x="970"
          y="84"
          width="54"
          height="45"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="997"
          y="102"
          text-anchor="middle"
          font-size="7"
          fill="#64748B"
          class="small">
      INPUT
    </text>

    <text x="997"
          y="119"
          text-anchor="middle"
          font-size="11"
          fill="#67E8F9"
          class="small">
      24
    </text>


    <rect x="1031"
          y="84"
          width="54"
          height="45"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="1058"
          y="102"
          text-anchor="middle"
          font-size="7"
          fill="#64748B"
          class="small">
      NEW
    </text>

    <text x="1058"
          y="119"
          text-anchor="middle"
          font-size="11"
          fill="#C084FC"
          class="small">
      48
    </text>


    <rect x="1092"
          y="84"
          width="38"
          height="45"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="1111"
          y="102"
          text-anchor="middle"
          font-size="7"
          fill="#64748B"
          class="small">
      STATUS
    </text>

    <text x="1111"
          y="119"
          text-anchor="middle"
          font-size="7"
          fill="#34D399"
          class="small">
      READY
    </text>


    <!-- ================================================= -->
    <!-- MONITOR GRAPH -->
    <!-- ================================================= -->

    <rect x="970"
          y="143"
          width="160"
          height="76"
          rx="8"
          fill="#06101A"
          stroke="#13283A"/>


    <!-- Grid -->

    <path d="M980 162H1120
             M980 181H1120
             M980 200H1120"
          stroke="#334155"
          stroke-opacity=".28"/>


    <!-- Input line -->

    <path d="M981 201
             L998 197
             L1015 200
             L1030 190
             L1045 195"
          fill="none"
          stroke="#22D3EE"
          stroke-width="2"
          class="flow"/>


    <!-- Constructed line -->

    <path d="M1045 195
             C1060 185 1067 176 1078 184
             C1089 191 1098 169 1119 157"
          fill="none"
          stroke="url(#violetG)"
          stroke-width="2.5"
          filter="url(#glowG)"
          class="flow"/>


    <!-- Moving scanner -->

    <rect x="981"
          y="150"
          width="2"
          height="57"
          fill="#22D3EE"
          class="scan"/>


    <text x="978"
          y="238"
          font-size="7.5"
          fill="#64748B"
          class="small">
      ORIGINAL
    </text>

    <text x="1120"
          y="238"
          text-anchor="end"
          font-size="7.5"
          fill="#C4B5FD"
          class="small">
      ENGINEERED
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DECORATIVE NODES -->
  <!-- ================================================= -->

  <circle cx="925"
          cy="55"
          r="2"
          fill="#22D3EE"
          class="pulse"/>

  <circle cx="925"
          cy="270"
          r="2"
          fill="#A78BFA"
          class="pulse"/>

  <circle cx="1165"
          cy="274"
          r="2"
          fill="#34D399"
          class="pulse"/>


  <!-- ================================================= -->
  <!-- BOTTOM LINE -->
  <!-- ================================================= -->

  <rect x="48"
        y="274"
        width="1104"
        height="1"
        fill="#1E3448"/>

</svg>
