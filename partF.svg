<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bgF" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.52" stop-color="#081521"/>
      <stop offset="1" stop-color="#06101A"/>
    </linearGradient>

    <linearGradient id="cyanF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="purpleF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="greenF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glowF">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowF">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- Different pattern from previous banners -->
    <pattern id="dotsF"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1"
              fill="#64748B"
              opacity=".13"/>
    </pattern>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* Flow */
      .flow {
        stroke-dasharray: 7 9;
        animation: flowF 1.5s linear infinite;
      }

      @keyframes flowF {
        to {
          stroke-dashoffset: -32;
        }
      }

      /* Floating */
      .floating {
        animation: floatF 4s ease-in-out infinite;
      }

      @keyframes floatF {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      /* Pulse */
      .pulse {
        animation: pulseF 2s ease-in-out infinite;
      }

      @keyframes pulseF {
        0%,100% {
          opacity: .35;
        }

        50% {
          opacity: 1;
        }
      }

      /* Scaling bars */
      .scaleBar {
        animation: scaleBarF 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes scaleBarF {
        0%,100% {
          transform: scaleY(.65);
        }

        50% {
          transform: scaleY(1);
        }
      }

      /* Scanner */
      .scanner {
        animation: scannerF 3s ease-in-out infinite;
      }

      @keyframes scannerF {
        0% {
          transform: translateX(0);
          opacity: 0;
        }

        20% {
          opacity: .8;
        }

        80% {
          opacity: .8;
        }

        100% {
          transform: translateX(130px);
          opacity: 0;
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bgF)"/>

  <rect width="1200"
        height="300"
        rx="22"
