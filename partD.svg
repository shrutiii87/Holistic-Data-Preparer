<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#0A1422"/>
      <stop offset="1" stop-color="#06101A"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyanD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Green -->
    <linearGradient id="greenD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Yellow -->
    <linearGradient id="yellowD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowD">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowD">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Grid -->
    <pattern id="gridD"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#64748B"
            stroke-opacity="0.045"/>
    </pattern>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* Flow animation */
      .flow {
        stroke-dasharray: 7 9;
        animation: flow 1.5s linear infinite;
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -32;
        }
      }

      /* Floating cards */
      .floating {
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      /* Pulse */
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,100% {
          opacity: .35;
        }

        50% {
          opacity: 1;
        }
      }

      /* Scanner */
      .scanner {
        animation: scanner 3s ease-in-out infinite;
      }

      @keyframes scanner {
        0% {
          transform: translateY(0);
          opacity: 0;
        }

        20% {
          opacity: .8;
        }

        80% {
          opacity: .8;
        }

        100% {
          transform: translateY(55px);
          opacity: 0;
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bgD)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#gridD)"/>

  <ellipse cx="1010"
           cy="145"
           rx="190"
           ry="135"
           fill="#0891B2"
           opacity=".06"
           filter="url(#softGlowD)"/>


  <!-- ================================================= -->
  <!-- LEFT ACCENT -->
  <!-- ================================================= -->

  <rect x="48"
        y="50"
        width="3"
        height="125"
        rx="2"
        fill="url(#cyanD)"
        filter="url(#glowD)"/>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- Dedicated safe area: x 70 → 375 -->
  <!-- ================================================= -->

  <text x="70"
        y="67"
        font-size="10"
        fill="#FBBF24"
