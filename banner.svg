<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#0A1422"/>
      <stop offset="1" stop-color="#06101A"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="largeGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Background grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#64748B"
            stroke-opacity="0.045"/>
    </pattern>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1.4px;
      }

      /* Moving data particles */
      .particle {
        animation: particleMove 4s linear infinite;
      }

      @keyframes particleMove {
        0% {
          transform: translateX(0);
          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        85% {
          opacity: 1;
        }

        100% {
          transform: translateX(500px);
          opacity: 0;
        }
      }

      /* Animated connection */
      .connection {
        stroke-dasharray: 5 9;
        animation: connectionMove 1.5s linear infinite;
      }

      @keyframes connectionMove {
        to {
          stroke-dashoffset: -28;
        }
      }

      /* Floating graphic */
      .floating {
        animation: floating 5s ease-in-out infinite;
      }

      @keyframes floating {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }
      }

      /* Pulse */
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,100% {
          opacity: .35;
          r: 3;
        }

        50% {
          opacity: 1;
          r: 5;
        }
      }

      /* Scan animation */
      .scanner {
        animation: scanner 3s ease-in-out infinite;
      }

      @keyframes scanner {
        0% {
          transform: translateY(0);
          opacity: 0;
        }

        20% {
          opacity: .8;
        }

        80% {
          opacity: .8;
        }

        100% {
          transform: translateY(95px);
          opacity: 0;
        }
      }

      /* Number animation */
      .number {
        animation: numberPulse 2.5s ease-in-out infinite;
      }

      @keyframes numberPulse {
        0%,100% {
          opacity: .55;
        }

        50% {
          opacity: 1;
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bg)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#grid)"/>


  <!-- Ambient glow -->

  <ellipse cx="1000"
           cy="150"
           rx="180"
           ry="130"
           fill="#0891B2"
           opacity=".06"
           filter="url(#largeGlow)"/>


  <!-- ================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ================================================= -->

  <!-- Vertical accent -->

  <rect x="48"
        y="48"
        width="3"
        height="128"
        rx="2"
        fill="url(#cyan)"
        filter="url(#cyanGlow)"/>


  <!-- Eyebrow -->

  <text x="70"
        y="65"
        font-size="10"
        fill="#38BDF8"
        class="small">
    DATA ENGINEERING / 2026
  </text>


  <!-- MAIN HEADING -->
  <!-- Dedicated large area -->

  <text x="70"
        y="108"
        font-size="34"
        fill="#F8FAFC"
        class="title">
    Holistic Data Preparer
  </text>


  <!-- Divider -->

  <rect x="70"
        y="125"
        width="410"
        height="1"
        fill="#1E3A52"/>


  <!-- Description line 1 -->

  <text x="70"
        y="151"
        font-size="13"
        fill="#94A3B8">
    End-to-end Data Preprocessing &amp; Feature Engineering
  </text>


  <!-- Description line 2 -->

  <text x="70"
        y="172"
        font-size="13"
        fill="#94A3B8">
    for Customer Credit Risk Intelligence
  </text>


  <!-- ================================================= -->
  <!-- MINI STATUS -->
  <!-- ================================================= -->

  <g transform="translate(70 199)">

    <rect width="180"
          height="34"
          rx="8"
          fill="#0B1B1B"
          stroke="#164E45"/>

    <circle cx="18"
            cy="17"
            r="4"
            fill="#34D399"
            filter="url(#cyanGlow)"
            class="pulse"/>

    <text x="32"
          y="21"
          font-size="10"
          fill="#6EE7B7"
          class="small">
      CREDIT DATA READY
    </text>

  </g>


  <!-- ================================================= -->
  <!-- PIPELINE -->
  <!-- ================================================= -->

  <g class="floating">

    <!-- Main line -->

    <path d="M270 216 H800"
          stroke="#18324A"
          stroke-width="2"/>


    <!-- Animated line -->

    <path d="M270 216 H800"
          stroke="url(#cyan)"
          stroke-width="2"
          opacity=".75"
          class="connection"/>


    <!-- NODE 1 -->

    <circle cx="310"
            cy="216"
            r="9"
            fill="#071522"
            stroke="#22D3EE"
            stroke-width="2"/>

    <circle cx="310"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"/>

    <text x="310"
          y="247"
          text-anchor="middle"
          font-size="9"
          fill="#64748B"
          class="small">
      LOAD
    </text>


    <!-- NODE 2 -->

    <circle cx="430"
            cy="216"
            r="9"
            fill="#071522"
            stroke="#22D3EE"
            stroke-width="2"/>

    <circle cx="430"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"/>

    <text x="430"
          y="247"
          text-anchor="middle"
          font-size="9"
          fill="#64748B"
          class="small">
      CLEAN
    </text>


    <!-- NODE 3 -->

    <circle cx="550"
            cy="216"
            r="9"
            fill="#071522"
            stroke="#22D3EE"
            stroke-width="2"/>

    <circle cx="550"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"/>

    <text x="550"
          y="247"
          text-anchor="middle"
          font-size="9"
          fill="#64748B"
          class="small">
      TRANSFORM
    </text>


    <!-- NODE 4 -->

    <circle cx="670"
            cy="216"
            r="9"
            fill="#071522"
            stroke="#22D3EE"
            stroke-width="2"/>

    <circle cx="670"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"/>

    <text x="670"
          y="247"
          text-anchor="middle"
          font-size="9"
          fill="#64748B"
          class="small">
      ENGINEER
    </text>


    <!-- FINAL NODE -->

    <circle cx="790"
            cy="216"
            r="11"
            fill="#06221B"
            stroke="#34D399"
            stroke-width="2"/>

    <circle cx="790"
            cy="216"
            r="4"
            fill="#34D399"
            filter="url(#cyanGlow)"
            class="pulse"/>

    <text x="790"
          y="247"
          text-anchor="middle"
          font-size="9"
          fill="#6EE7B7"
          class="small">
      MODEL READY
    </text>


    <!-- Moving data particles -->

    <circle cx="280"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"
            class="particle"/>

    <circle cx="280"
            cy="216"
            r="3"
            fill="#67E8F9"
            filter="url(#cyanGlow)"
            class="particle"
            style="animation-delay:2s"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT ANALYTICS CARD -->
  <!-- ================================================= -->

  <g class="floating">

    <rect x="850"
          y="42"
          width="300"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>


    <!-- Card heading -->

    <text x="875"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      CUSTOMER CREDIT RISK
    </text>


    <text x="875"
          y="92"
          font-size="18"
          fill="#E2E8F0"
          class="title">
      Feature Quality
    </text>


    <!-- Status -->

    <circle cx="1118"
            cy="88"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- Chart -->

    <rect x="875"
          y="110"
          width="250"
          height="100"
          rx="8"
          fill="#06101A"
          stroke="#13283A"/>


    <!-- Chart grid -->

    <path d="M890 130 H1110
             M890 155 H1110
             M890 180 H1110
             M890 200 H1110"
          stroke="#334155"
          stroke-opacity=".35"/>


    <!-- Chart line -->

    <path d="M895 188
             C915 180 925 185 940 165
             C955 148 968 160 982 150
             C997 139 1005 145 1020 130
             C1035 120 1050 140 1060 128
             C1075 112 1090 125 1110 118"
          fill="none"
          stroke="url(#green)"
          stroke-width="2.5"
          filter="url(#cyanGlow)"
          class="connection"/>


    <!-- Data points -->

    <circle cx="940" cy="165" r="3"
            fill="#34D399"
            class="pulse"/>

    <circle cx="982" cy="150" r="3"
            fill="#34D399"
            class="pulse"/>

    <circle cx="1020" cy="130" r="3"
            fill="#34D399"
            class="pulse"/>

    <circle cx="1060" cy="128" r="3"
            fill="#34D399"
            class="pulse"/>


    <!-- Scanner -->

    <rect x="890"
          y="118"
          width="220"
          height="2"
          fill="#22D3EE"
          opacity=".7"
          class="scanner"/>


    <!-- Metrics -->

    <text x="875"
          y="232"
          font-size="9"
          fill="#64748B"
          class="small">
      CLEAN FEATURES
    </text>

    <text x="1010"
          y="232"
          font-size="9"
          fill="#64748B"
          class="small">
      DATA QUALITY
    </text>

    <text x="875"
          y="247"
          font-size="11"
          fill="#CBD5E1"
          class="number">
      100%
    </text>

    <text x="1010"
          y="247"
          font-size="11"
          fill="#6EE7B7"
          class="number">
      OPTIMIZED
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DECORATIVE DATA PARTICLES -->
  <!-- ================================================= -->

  <circle cx="820"
          cy="58"
          r="2"
          fill="#22D3EE"
          class="pulse"/>

  <circle cx="825"
          cy="275"
          r="2"
          fill="#34D399"
          class="pulse"/>

  <circle cx="1165"
          cy="275"
          r="2"
          fill="#22D3EE"
          class="pulse"/>


  <!-- Bottom accent -->

  <rect x="48"
        y="274"
        width="1104"
        height="1"
        fill="#1E3448"/>

</svg>
