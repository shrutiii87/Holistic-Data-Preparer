<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bgE" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#0A1422"/>
      <stop offset="1" stop-color="#06101A"/>
    </linearGradient>

    <linearGradient id="cyanE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="greenE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="purpleE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glowE">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowE">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <pattern id="gridE"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#64748B"
            stroke-opacity="0.045"/>
    </pattern>

    <!-- ================================================= -->
    <!-- ANIMATION -->
    <!-- ================================================= -->

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      .flow {
        stroke-dasharray: 7 9;
        animation: flowE 1.5s linear infinite;
      }

      @keyframes flowE {
        to {
          stroke-dashoffset: -32;
        }
      }

      .floating {
        animation: floatingE 4s ease-in-out infinite;
      }

      @keyframes floatingE {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      .pulse {
        animation: pulseE 2s ease-in-out infinite;
      }

      @keyframes pulseE {
        0%,100% {
          opacity: .35;
        }

        50% {
          opacity: 1;
        }
      }

      .scan {
        animation: scanE 3s ease-in-out infinite;
      }

      @keyframes scanE {
        0% {
          transform: translateY(0);
          opacity: 0;
        }

        20% {
          opacity: .8;
        }

        80% {
          opacity: .8;
        }

        100% {
          transform: translateY(60px);
          opacity: 0;
        }
      }

      .bars {
        animation: barsE 2.2s ease-in-out infinite;
        transform-origin: bottom;
      }

      @keyframes barsE {
        0%,100% {
          transform: scaleY(.65);
        }

        50% {
          transform: scaleY(1);
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bgE)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#gridE)"/>

  <ellipse cx="1010"
           cy="145"
           rx="190"
           ry="135"
           fill="#7C3AED"
           opacity=".055"
           filter="url(#softGlowE)"/>


  <!-- ================================================= -->
  <!-- LEFT ACCENT -->
  <!-- ================================================= -->

  <rect x="48"
        y="48"
        width="3"
        height="130"
        rx="2"
        fill="url(#cyanE)"
        filter="url(#glowE)"/>


  <!-- ================================================= -->
  <!-- HEADER SAFE ZONE -->
  <!-- ================================================= -->

  <text x="70"
        y="66"
        font-size="10"
        fill="#C084FC"
        class="small">
    DATA PIPELINE / PART E
  </text>

  <text x="70"
        y="108"
        font-size="29"
        fill="#F8FAFC"
        class="title">
    Feature Engineering
  </text>

  <rect x="70"
        y="123"
        width="315"
        height="1"
        fill="#1E3A52"/>

  <text x="70"
        y="149"
        font-size="12"
        fill="#94A3B8">
    Transform → Create → Select
  </text>


  <!-- STATUS -->

  <g transform="translate(70 181)">

    <rect width="205"
          height="36"
          rx="9"
          fill="#101025"
          stroke="#35275A"/>

    <circle cx="18"
            cy="18"
            r="4"
            fill="#C084FC"
            filter="url(#glowE)"
            class="pulse"/>

    <text x="32"
          y="22"
          font-size="10"
          fill="#D8B4FE"
          class="small">
      FEATURES ACTIVE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- MAIN PROCESS -->
  <!-- ================================================= -->

  <g class="floating">


    <!-- ================================================= -->
    <!-- TRANSFORM -->
    <!-- ================================================= -->

    <rect x="405"
          y="62"
          width="130"
          height="54"
          rx="11"
          fill="#081522"
          stroke="#1E4058"/>


    <!-- Transformation icon -->

    <path d="M423 80
             H449
             M423 88
             H443
             M423 96
             H453"
          stroke="#22D3EE"
          stroke-width="2"
          stroke-linecap="round"/>

    <circle cx="459"
            cy="80"
            r="3"
            fill="#67E8F9"/>

    <circle cx="453"
            cy="96"
            r="3"
            fill="#67E8F9"/>


    <text x="475"
          y="84"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      TRANSFORM
    </text>

    <text x="475"
