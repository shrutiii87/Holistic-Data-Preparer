          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M535 157 H585"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M535 225
             C558 225 558 181 585 181"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>


    <path d="M535 89
             C558 89 558 140 585 140"
          fill="none"
          stroke="url(#cyanE)"
          stroke-width="2"
          class="flow"/>

    <path d="M535 157 H585"
          fill="none"
          stroke="url(#purpleE)"
          stroke-width="2"
          class="flow"/>

    <path d="M535 225
             C558 225 558 181 585 181"
          fill="none"
          stroke="url(#greenE)"
          stroke-width="2"
          class="flow"/>


    <!-- ================================================= -->
    <!-- FEATURE ENGINE -->
    <!-- ================================================= -->

    <rect x="585"
          y="119"
          width="165"
          height="80"
          rx="15"
          fill="#091B2A"
          stroke="#7C3AED"
          stroke-opacity=".75"/>


    <!-- Neural feature icon -->

    <circle cx="615"
            cy="147"
            r="5"
            fill="#67E8F9"
            class="pulse"/>

    <circle cx="615"
            cy="171"
            r="5"
            fill="#C084FC"
            class="pulse"
            style="animation-delay:.5s"/>

    <circle cx="632"
            cy="159"
            r="6"
            fill="#22D3EE"
            filter="url(#glowE)"/>

    <path d="M615 147L632 159L615 171"
          fill="none"
          stroke="#38BDF8"
          stroke-width="1.5"/>


    <text x="650"
          y="151"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      FEATURE
    </text>

    <text x="650"
          y="167"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      ENGINE
    </text>

    <text x="650"
          y="183"
          font-size="8"
          fill="#64748B">
      BUILD FEATURES
    </text>


    <!-- ================================================= -->
    <!-- OUTPUT -->
    <!-- ================================================= -->

    <path d="M750 159 H790"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M750 159 H790"
          stroke="url(#greenE)"
          stroke-width="2"
          class="flow"/>


    <rect x="790"
          y="126"
          width="130"
          height="66"
          rx="13"
          fill="#071D19"
          stroke="#166534"/>


    <circle cx="814"
            cy="159"
            r="11"
            fill="#092A22"
            stroke="#34D399"
            stroke-width="2"/>

    <path d="M808 159
             L813 164
             L822 153"
          fill="none"
          stroke="#6EE7B7"
          stroke-width="2"/>


    <text x="835"
          y="155"
          font-size="10"
          fill="#D1FAE5"
          class="small">
      READY
    </text>

    <text x="835"
          y="171"
          font-size="8"
          fill="#6EE7B7">
      FOR PART F
    </text>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT MONITOR -->
  <!-- ================================================= -->

  <g class="floating">

    <rect x="940"
          y="42"
          width="210"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>


    <text x="960"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      FEATURE MONITOR
    </text>

    <circle cx="1120"
            cy="65"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- Metric cards -->

    <rect x="960"
          y="84"
          width="58"
          height="47"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="989"
          y="103"
          text-anchor="middle"
          font-size="8"
          fill="#64748B"
          class="small">
      INPUT
    </text>

    <text x="989"
          y="119"
          text-anchor="middle"
          font-size="10"
          fill="#67E8F9"
          class="small">
      RAW
    </text>


    <rect x="1025"
          y="84"
          width="58"
          height="47"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="1054"
          y="103"
          text-anchor="middle"
          font-size="8"
          fill="#64748B"
          class="small">
      NEW
    </text>

    <text x="1054"
          y="119"
          text-anchor="middle"
          font-size="10"
          fill="#C084FC"
          class="small">
      FEATURES
    </text>


    <rect x="1090"
          y="84"
          width="42"
          height="47"
          rx="8"
          fill="#0A1C2A"
          stroke="#17364C"/>

    <text x="1111"
          y="103"
          text-anchor="middle"
          font-size="8"
          fill="#64748B"
          class="small">
      STATUS
    </text>

    <text x="1111"
          y="119"
          text-anchor="middle"
          font-size="8"
          fill="#34D399"
          class="small">
      READY
    </text>


    <!-- ================================================= -->
    <!-- FEATURE CHART -->
    <!-- ================================================= -->

    <rect x="960"
          y="145"
          width="172"
          height="73"
          rx="8"
          fill="#06101A"
          stroke="#13283A"/>


    <!-- Baseline -->

    <line x1="973"
          y1="204"
          x2="1118"
          y2="204"
          stroke="#334155"
          stroke-opacity=".5"/>


    <!-- Feature bars -->

    <rect x="982"
          y="181"
          width="12"
          height="23"
          rx="2"
          fill="#22D3EE"
          class="bars"/>

    <rect x="1002"
          y="170"
          width="12"
          height="34"
          rx="2"
          fill="#38BDF8"
          class="bars"
          style="animation-delay:.2s"/>

    <rect x="1022"
          y="187"
          width="12"
          height="17"
          rx="2"
