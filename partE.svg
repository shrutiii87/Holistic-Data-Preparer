    <circle cx="450"
            cy="148"
            r="4"
            fill="#67E8F9"/>

    <circle cx="439"
            cy="166"
            r="4"
            fill="#C084FC"/>

    <path d="M428 148L439 166L450 148"
          fill="none"
          stroke="#38BDF8"
          stroke-width="1.5"/>


    <text x="475"
          y="153"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      CREATE
    </text>

    <text x="475"
          y="169"
          font-size="8"
          fill="#64748B">
      NEW FEATURES
    </text>


    <!-- ================================================= -->
    <!-- SELECT -->
    <!-- ================================================= -->

    <rect x="405"
          y="198"
          width="130"
          height="54"
          rx="11"
          fill="#081522"
          stroke="#1E4058"/>


    <!-- Selection bars -->

    <rect x="423"
          y="215"
          width="8"
          height="22"
          rx="2"
          fill="#22D3EE"
          class="bars"/>

    <rect x="437"
          y="209"
          width="8"
          height="28"
          rx="2"
          fill="#67E8F9"
          class="bars"
