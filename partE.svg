          style="animation-delay:.6s"/>


    <text x="485"
          y="219"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      SELECT
    </text>

    <text x="485"
          y="235"
          font-size="8"
          fill="#64748B">
      BEST FEATURES
    </text>


    <!-- ================================================= -->
    <!-- FLOW LINES -->
    <!-- ================================================= -->

    <path d="M535 89
