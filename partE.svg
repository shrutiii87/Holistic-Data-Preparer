          class="bars"
          style="animation-delay:.8s"/>

    <rect x="1082"
          y="166"
          width="12"
          height="38"
          rx="2"
          fill="#34D399"
          class="bars"
          style="animation-delay:1s"/>


    <!-- Scanner -->

    <rect x="973"
          y="151"
          width="142"
          height="2"
          fill="#C084FC"
          opacity=".65"
          class="scan"/>


    <text x="970"
          y="237"
          font-size="8"
          fill="#64748B"
          class="small">
      FEATURES
    </text>

    <text x="1120"
          y="237"
          text-anchor="end"
          font-size="8"
          fill="#6EE7B7"
          class="small">
