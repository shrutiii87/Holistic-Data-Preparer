    <rect x="560"
          y="119"
          width="155"
          height="80"
          rx="15"
          fill="#091B2A"
          stroke="#2563EB"
          stroke-opacity=".7"/>

    <circle cx="589"
            cy="159"
            r="13"
            fill="#08283A"
            stroke="#22D3EE"
            stroke-width="2"
            filter="url(#glow)"/>

    <circle cx="589"
            cy="159"
            r="5"
            fill="#67E8F9"
            class="pulse"/>

    <text x="613"
          y="151"
          font-size="10"
          fill="#CBD5E1"
          class="small">
        DATA
    </text>

    <text x="613"
          y="167"
          font-size="10"
          fill="#CBD5E1"
          class="small">
        INGESTION
    </text>

    <text x="613"
