  </g>


  <!-- Decorative particles -->

  <circle cx="895"
          cy="57"
          r="2"
          fill="#22D3EE"
          class="pulse"/>

  <circle cx="895"
          cy="270"
          r="2"
          fill="#34D399"
          class="pulse"/>

  <circle cx="1165"
          cy="274"
          r="2"
          fill="#22D3EE"
          class="pulse"/>


  <!-- Bottom border -->

  <rect x="48"
        y="274"
        width="1104"
        height="1"
        fill="#1E3448"/>

</svg>
