      </text>

    </g>


    <!-- SQL -->

    <g>

      <rect x="385"
            y="198"
            width="125"
            height="54"
            rx="11"
            fill="#081522"
            stroke="#1E4058"/>

      <ellipse cx="405"
               cy="211"
               rx="11"
               ry="4"
               fill="#0E2637"
               stroke="#38BDF8"/>

      <path d="M394 211V226
               C394 231 416 231 416 226V211"
