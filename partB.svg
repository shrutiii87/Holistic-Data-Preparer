          font-size="8"
          fill="#64748B">
        ACQUISITION HUB
    </text>


    <!-- ================================================= -->
    <!-- OUTPUT -->
    <!-- ================================================= -->

    <path d="M715 159 H755"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M715 159 H755"
          stroke="url(#green)"
          stroke-width="2"
          class="flow"/>


    <rect x="755"
          y="126"
          width="130"
          height="66"
          rx="13"
          fill="#071D19"
          stroke="#166534"/>

    <circle cx="779"
            cy="159"
            r="11"
            fill="#092A22"
            stroke="#34D399"
            stroke-width="2"/>

    <path d="M773 159L778 164L787 153"
          fill="none"
          stroke="#6EE7B7"
          stroke-width="2"/>

    <text x="800"
          y="155"
          font-size="10"
          fill="#D1FAE5"
          class="small">
        ACQUIRED
    </text>

    <text x="800"
          y="171"
          font-size="8"
          fill="#6EE7B7">
        READY FOR PART C
    </text>


    <!-- Moving packet -->

    <circle cx="520"
            cy="157"
            r="3"
            fill="#67E8F9"
            filter="url(#glow)"
            class="packet"/>

    <circle cx="520"
            cy="157"
            r="3"
            fill="#67E8F9"
            filter="url(#glow)"
            class="packet"
            style="animation-delay:1.5s"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT MONITOR -->
  <!-- ================================================= -->

  <g class="floating">

    <rect x="905"
          y="42"
          width="245"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>


    <text x="927"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      ACQUISITION MONITOR
    </text>

    <circle cx="1120"
            cy="65"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- Status cards -->

    <g>

      <rect x="927"
            y="84"
            width="68"
            height="47"
            rx="8"
            fill="#0A1C2A"
            stroke="#17364C"/>

      <text x="961"
            y="103"
            text-anchor="middle"
            font-size="8"
            fill="#64748B"
            class="small">
        CSV
      </text>

      <text x="961"
            y="119"
            text-anchor="middle"
            font-size="9"
            fill="#67E8F9"
            class="small">
        CONNECTED
      </text>

    </g>


    <g>

      <rect x="1003"
            y="84"
            width="68"
            height="47"
            rx="8"
            fill="#0A1C2A"
            stroke="#17364C"/>

      <text x="1037"
            y="103"
            text-anchor="middle"
            font-size="8"
            fill="#64748B"
            class="small">
        JSON
      </text>

      <text x="1037"
            y="119"
            text-anchor="middle"
            font-size="9"
            fill="#67E8F9"
            class="small">
        CONNECTED
      </text>

    </g>


    <g>

      <rect x="1079"
            y="84"
            width="52"
            height="47"
            rx="8"
            fill="#0A1C2A"
            stroke="#17364C"/>

      <text x="1105"
            y="103"
            text-anchor="middle"
            font-size="8"
            fill="#64748B"
            class="small">
        SQL
      </text>

      <text x="1105"
            y="119"
            text-anchor="middle"
            font-size="8"
            fill="#34D399"
            class="small">
        READY
      </text>

    </g>


    <!-- Chart -->

    <rect x="927"
          y="145"
          width="204"
          height="73"
          rx="8"
          fill="#06101A"
          stroke="#13283A"/>

    <path d="M938 163H1120
             M938 184H1120
             M938 205H1120"
          stroke="#334155"
          stroke-opacity=".35"/>

    <path d="M939 199
             L953 199
             L966 183
             L978 191
             L991 171
             L1004 184
             L1018 164
             L1031 177
             L1046 155
             L1059 169
             L1073 150
             L1086 161
             L1100 145
             L1112 151"
