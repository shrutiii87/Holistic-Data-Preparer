          stroke-width="2"
          class="flow"/>

    <path d="M510 157 H560"
          fill="none"
          stroke="url(#cyan)"
          stroke-width="2"
          class="flow"/>

    <path d="M510 225
             C535 225 535 180 560 180"
          fill="none"
          stroke="url(#cyan)"
          stroke-width="2"
          class="flow"/>


    <!-- ================================================= -->
