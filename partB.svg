<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#0A1422"/>
      <stop offset="1" stop-color="#06101A"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Green -->
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#64748B"
            stroke-opacity="0.045"/>
    </pattern>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
        letter-spacing: 0;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1.2px;
      }

      .flow {
        stroke-dasharray: 7 9;
        animation: flow 1.4s linear infinite;
      }

      @keyframes flow {
        to {
          stroke-dashoffset: -32;
        }
      }

      .floating {
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%,100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-5px);
        }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,100% {
          opacity: .35;
        }

        50% {
          opacity: 1;
        }
      }

      .scanner {
        animation: scanner 3s ease-in-out infinite;
      }

      @keyframes scanner {
        0% {
          transform: translateY(0);
          opacity: 0;
        }

        20% {
          opacity: .8;
        }

        80% {
          opacity: .8;
        }

        100% {
          transform: translateY(88px);
          opacity: 0;
        }
      }

      .packet {
        animation: packet 3s linear infinite;
      }

      @keyframes packet {
        0% {
          transform: translateX(0);
          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        80% {
          opacity: 1;
        }

        100% {
          transform: translateX(130px);
          opacity: 0;
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bg)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#grid)"/>

  <ellipse cx="1000"
           cy="145"
           rx="190"
           ry="135"
           fill="#0891B2"
           opacity=".06"
           filter="url(#softGlow)"/>


  <!-- ================================================= -->
  <!-- LEFT ACCENT -->
  <!-- ================================================= -->

  <rect x="48"
        y="47"
        width="3"
        height="128"
        rx="2"
        fill="url(#cyan)"
        filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- HEADER AREA -->
  <!-- IMPORTANT: SOURCE CARDS START AFTER X=390 -->
  <!-- ================================================= -->

  <text x="70"
        y="65"
        font-size="10"
        fill="#38BDF8"
        class="small">
    DATA PIPELINE / PART B
  </text>


  <!-- FIXED HEADING -->
  <!-- Dedicated width from x=70 to x=360 -->

  <text x="70"
        y="108"
        font-size="32"
        fill="#F8FAFC"
        class="title">
    Data Acquisition
  </text>


  <!-- Heading divider -->

  <rect x="70"
        y="123"
        width="285"
        height="1"
        fill="#1E3A52"/>


  <!-- Description -->

  <text x="70"
        y="148"
        font-size="12.5"
        fill="#94A3B8">
    Collecting reliable customer data
  </text>

  <text x="70"
        y="168"
        font-size="12.5"
        fill="#94A3B8">
    from structured and external sources.
  </text>


  <!-- Status -->

  <g transform="translate(70 195)">

    <rect width="190"
          height="34"
          rx="8"
          fill="#081A20"
          stroke="#164E63"/>

    <circle cx="18"
            cy="17"
            r="4"
            fill="#22D3EE"
            filter="url(#glow)"
            class="pulse"/>

    <text x="32"
          y="21"
          font-size="10"
          fill="#67E8F9"
          class="small">
      SOURCES CONNECTED
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DATA SOURCES -->
  <!-- MOVED RIGHT TO PREVENT HEADING OVERLAP -->
  <!-- ================================================= -->

  <g class="floating">


    <!-- CSV -->

    <g>

      <rect x="385"
            y="62"
            width="125"
            height="54"
            rx="11"
            fill="#081522"
            stroke="#1E4058"/>

      <rect x="403"
            y="77"
            width="19"
            height="24"
            rx="3"
            fill="#0E2637"
            stroke="#38BDF8"/>

      <path d="M407 84H418
               M407 90H418
               M407 96H415"
