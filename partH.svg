<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bgH" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0" stop-color="#040A12"/>
      <stop offset="0.5" stop-color="#091624"/>
      <stop offset="1" stop-color="#050D16"/>
    </linearGradient>

    <linearGradient id="cyanH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="greenH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="violetH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Different pattern for Part H -->
    <pattern id="gridH"
             width="36"
             height="36"
             patternUnits="userSpaceOnUse">

      <path d="M36 0H0V36"
            fill="none"
            stroke="#64748B"
            stroke-opacity=".055"/>

      <circle cx="18"
              cy="18"
              r="1.2"
              fill="#22D3EE"
              opacity=".06"/>

    </pattern>

    <filter id="glowH">
      <feGaussianBlur stdDeviation="4"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowH">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <style>

      text {
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .title {
        font-weight: 700;
      }

      .small {
        font-weight: 600;
        letter-spacing: 1px;
      }

      .flow {
        stroke-dasharray: 6 9;
        animation: flowH 1.5s linear infinite;
      }

      @keyframes flowH {
        to {
          stroke-dashoffset: -30;
        }
      }

      .float {
        animation: floatH 4s ease-in-out infinite;
      }

      @keyframes floatH {
        0%,100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .pulse {
        animation: pulseH 2s ease-in-out infinite;
      }

      @keyframes pulseH {
        0%,100% {
          opacity: .35;
        }
        50% {
          opacity: 1;
        }
      }

      .scan {
        animation: scanH 3s ease-in-out infinite;
      }

      @keyframes scanH {
        0% {
          transform: translateX(0);
          opacity: 0;
        }
        20% {
          opacity: .8;
        }
        80% {
          opacity: .8;
        }
        100% {
          transform: translateX(145px);
          opacity: 0;
        }
      }

      .rotate {
        animation: rotateH 8s linear infinite;
        transform-origin: center;
      }

      @keyframes rotateH {
        to {
          transform: rotate(360deg);
        }
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#bgH)"/>

  <rect width="1200"
        height="300"
        rx="22"
        fill="url(#gridH)"/>

  <ellipse cx="1030"
           cy="150"
           rx="200"
           ry="140"
           fill="#10B981"
           opacity=".045"
           filter="url(#softGlowH)"/>


  <!-- ================================================= -->
  <!-- LEFT HEADER -->
  <!-- ================================================= -->

  <rect x="48"
        y="48"
        width="3"
        height="130"
        rx="2"
        fill="url(#cyanH)"
        filter="url(#glowH)"/>

  <text x="70"
        y="66"
        font-size="10"
        fill="#67E8F9"
        class="small">
    DATA PIPELINE / PART H
  </text>

  <text x="70"
        y="108"
        font-size="30"
        fill="#F8FAFC"
        class="title">
    Final Deliverable
  </text>

  <rect x="70"
        y="123"
        width="270"
        height="1"
        fill="#1E3A52"/>

  <text x="70"
        y="148"
        font-size="12"
        fill="#94A3B8">
    Clean, transformed &amp; ready.
  </text>


  <!-- STATUS -->

  <g transform="translate(70 178)">

    <rect width="190"
          height="36"
          rx="9"
          fill="#071D19"
          stroke="#166534"/>

    <circle cx="18"
            cy="18"
            r="4"
            fill="#34D399"
            filter="url(#glowH)"
            class="pulse"/>

    <text x="32"
          y="22"
          font-size="9.5"
          fill="#6EE7B7"
          class="small">
      PIPELINE COMPLETE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- CENTRAL DELIVERY FLOW -->
  <!-- ================================================= -->

  <g class="float">


    <!-- CLEAN DATA -->

    <rect x="390"
          y="80"
          width="135"
          height="62"
          rx="13"
          fill="#081925"
          stroke="#155E75"/>

    <!-- database icon -->

    <ellipse cx="414"
             cy="96"
             rx="11"
             ry="5"
             fill="#0B2B3C"
             stroke="#22D3EE"/>

    <path d="M403 96V112
             C403 118 425 118 425 112V96"
          fill="#0B2B3C"
          stroke="#22D3EE"/>

    <path d="M403 104
             C403 110 425 110 425 104"
          fill="none"
          stroke="#22D3EE"/>

    <text x="440"
          y="102"
          font-size="10"
          fill="#CBD5E1"
          class="small">
      CLEAN DATA
    </text>

    <text x="440"
          y="118"
          font-size="8"
          fill="#64748B">
      VALIDATED
    </text>


    <!-- FLOW 1 -->

    <path d="M525 111H555"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M525 111H555"
          fill="none"
          stroke="url(#cyanH)"
          stroke-width="2"
          class="flow"/>


    <!-- FINAL REPORT -->

    <rect x="555"
          y="68"
          width="155"
          height="86"
          rx="15"
          fill="#0C1224"
          stroke="#4C1D95"/>

    <!-- document -->

    <rect x="579"
          y="88"
          width="28"
          height="38"
          rx="4"
          fill="#15112B"
          stroke="#A78BFA"
          stroke-width="1.5"/>

    <path d="M585 98H601
             M585 105H601
             M585 112H597"
          stroke="#C4B5FD"
          stroke-width="1.5"/>

    <circle cx="600"
            cy="120"
            r="4"
            fill="#34D399"
            class="pulse"/>

    <text x="620"
          y="100"
          font-size="10"
          fill="#E9D5FF"
          class="small">
      FINAL
    </text>

    <text x="620"
          y="116"
          font-size="10"
          fill="#E9D5FF"
          class="small">
      DATASET
    </text>

    <text x="620"
          y="133"
          font-size="8"
          fill="#8B7DB8">
      READY
    </text>


    <!-- FLOW 2 -->

    <path d="M710 111H745"
          fill="none"
          stroke="#183B52"
          stroke-width="2"/>

    <path d="M710 111H745"
          fill="none"
          stroke="url(#greenH)"
          stroke-width="2"
          class="flow"/>


    <!-- EXPORT -->

    <rect x="745"
          y="80"
          width="140"
          height="62"
          rx="13"
          fill="#071D19"
          stroke="#166534"/>

    <!-- download icon -->

    <circle cx="770"
            cy="111"
            r="14"
            fill="#092A22"
            stroke="#34D399"
            stroke-width="1.5"/>

    <path d="M770 101V116
             M764 110L770 116L776 110"
          fill="none"
          stroke="#6EE7B7"
          stroke-width="2"/>

    <text x="792"
          y="105"
          font-size="10"
          fill="#D1FAE5"
          class="small">
      EXPORT
    </text>

    <text x="792"
          y="121"
          font-size="8"
          fill="#6EE7B7">
      CSV / REPORT
    </text>


    <!-- ================================================= -->
    <!-- LOWER SUMMARY STRIP -->
    <!-- ================================================= -->

    <rect x="390"
          y="174"
          width="495"
          height="52"
          rx="12"
          fill="#07131F"
          stroke="#17354A"/>

    <!-- metric 1 -->

    <circle cx="418"
            cy="195"
            r="6"
            fill="#22D3EE"
            class="pulse"/>

    <text x="433"
          y="198"
          font-size="9"
          fill="#CBD5E1"
          class="small">
      CLEAN
    </text>

    <!-- divider -->

    <line x1="500"
          y1="184"
          x2="500"
          y2="216"
          stroke="#1E3448"/>

    <!-- metric 2 -->

    <circle cx="526"
            cy="195"
            r="6"
            fill="#A78BFA"
            class="pulse"/>

    <text x="541"
          y="198"
          font-size="9"
          fill="#CBD5E1"
          class="small">
      ENGINEERED
    </text>

    <!-- divider -->

    <line x1="635"
          y1="184"
          x2="635"
          y2="216"
          stroke="#1E3448"/>

    <!-- metric 3 -->

    <circle cx="661"
            cy="195"
            r="6"
            fill="#34D399"
            class="pulse"/>

    <text x="676"
          y="198"
          font-size="9"
          fill="#CBD5E1"
          class="small">
      VALIDATED
    </text>

    <!-- divider -->

    <line x1="765"
          y1="184"
          x2="765"
          y2="216"
          stroke="#1E3448"/>

    <!-- metric 4 -->

    <circle cx="791"
            cy="195"
            r="6"
            fill="#67E8F9"
            class="pulse"/>

    <text x="806"
          y="198"
          font-size="9"
          fill="#CBD5E1"
          class="small">
      READY
    </text>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT FINAL MONITOR -->
  <!-- ================================================= -->

  <g class="float">

    <rect x="930"
          y="42"
          width="220"
          height="210"
          rx="16"
          fill="#08131F"
          stroke="#1C3449"/>

    <text x="950"
          y="68"
          font-size="10"
          fill="#64748B"
          class="small">
      DELIVERY STATUS
    </text>

    <circle cx="1120"
            cy="65"
            r="4"
            fill="#34D399"
            class="pulse"/>


    <!-- STATUS CARD -->

    <rect x="950"
          y="84"
          width="180"
          height="48"
          rx="9"
          fill="#071D19"
          stroke="#14532D"/>

    <circle cx="973"
            cy="108"
            r="11"
            fill="#092A22"
            stroke="#34D399"
            stroke-width="2"/>

    <path d="M968 108L972 112L980 103"
          fill="none"
          stroke="#6EE7B7"
          stroke-width="2"/>

    <text x="994"
          y="105"
          font-size="10"
          fill="#D1FAE5"
          class="small">
      COMPLETE
    </text>

    <text x="994"
          y="119"
          font-size="8"
          fill="#6EE7B7">
      READY TO USE
    </text>


    <!-- ================================================= -->
    <!-- FINAL QUALITY GRAPH -->
    <!-- ================================================= -->

    <rect x="950"
          y="145"
          width="180"
          height="73"
          rx="8"
          fill="#06101A"
          stroke="#13283A"/>

    <text x="965"
          y="160"
          font-size="8"
          fill="#64748B"
          class="small">
      QUALITY
    </text>


    <!-- progress tracks -->

    <rect x="965"
          y="173"
          width="145"
          height="6"
          rx="3"
          fill="#17283A"/>

    <rect x="965"
          y="173"
          width="132"
          height="6"
          rx="3"
          fill="url(#cyanH)"
          class="flow"/>


    <rect x="965"
          y="188"
          width="145"
          height="6"
          rx="3"
          fill="#17283A"/>

    <rect x="965"
          y="188"
          width="140"
          height="6"
          rx="3"
          fill="url(#violetH)"
          class="flow"/>


    <rect x="965"
          y="203"
          width="145"
          height="6"
          rx="3"
          fill="#17283A"/>

    <rect x="965"
          y="203"
          width="145"
          height="6"
          rx="3"
          fill="url(#greenH)"
          class="flow"/>


    <!-- scanner -->

    <rect x="965"
          y="166"
          width="2"
          height="47"
          fill="#67E8F9"
          class="scan"/>


    <text x="965"
          y="237"
          font-size="7.5"
          fill="#64748B"
          class="small">
      FINAL CHECK
    </text>

    <text x="1118"
          y="237"
          text-anchor="end"
          font-size="7.5"
          fill="#6EE7B7"
          class="small">
      PASSED
    </text>

  </g>


  <!-- ================================================= -->
  <!-- DECORATIVE PARTICLES -->
  <!-- ================================================= -->

  <circle cx="910"
          cy="56"
          r="2"
          fill="#22D3EE"
          class="pulse"/>

  <circle cx="910"
          cy="270"
          r="2"
          fill="#A78BFA"
          class="pulse"/>

  <circle cx="1165"
          cy="274"
          r="2"
          fill="#34D399"
          class="pulse"/>


  <!-- ================================================= -->
  <!-- BOTTOM BORDER -->
  <!-- ================================================= -->

  <rect x="48"
        y="274"
        width="1104"
        height="1"
        fill="#1E3448"/>

</svg>
